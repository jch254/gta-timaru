<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Characters · THE 03</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1c2026; color: #e6e8ea; font: 12px/1.4 system-ui, sans-serif; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; }
      #bar { position: fixed; left: 0; right: 0; top: 0; padding: 6px 8px; display: flex; flex-wrap: wrap; gap: 4px; background: rgba(20, 22, 26, 0.72); }
      #bar button { font: inherit; color: inherit; background: #333a44; border: 1px solid #55606e; border-radius: 3px; padding: 2px 7px; cursor: pointer; }
      #bar button.on { background: #b3261e; border-color: #e0584e; }
      #bar label { display: flex; align-items: center; gap: 4px; margin-left: 8px; }
      #info { position: fixed; left: 8px; bottom: 8px; white-space: pre; pointer-events: none; text-shadow: 0 1px 2px #000; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="bar"></div>
    <div id="info"></div>
    <script type="module" src="./characters.ts"></script>
  </body>
</html>
