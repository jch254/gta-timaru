version: 0.2

# Builds 03 Quest and deploys it to S3 behind CloudFront.
# Triggered by CodeBuild on pushes to the source branch (see infrastructure/).

# The project supplies SITE_BUCKET and DISTRIBUTION_ID; no state or secrets are needed.

phases:
  install:
    commands:
      - ': "${SITE_BUCKET:?missing project site bucket}" "${DISTRIBUTION_ID:?missing project distribution}"'
      - echo Installing Node dependencies...
      - corepack enable
      - corepack prepare pnpm@10.32.0 --activate
      - pnpm install --frozen-lockfile

  pre_build:
    commands:
      - echo Running the unit tests...
      - pnpm test

  build:
    on-failure: ABORT
    commands:
      - echo Building the game...
      - pnpm run build
      - test -s dist/index.html || { echo "Build did not produce dist/index.html"; exit 1; }
      - test -s dist/version.json || { echo "Build did not produce dist/version.json"; exit 1; }

      # Wire browser gate #10 here against dist/, before any publish command.

  post_build:
    commands:
      - test "$CODEBUILD_BUILD_SUCCEEDING" = 1 || exit 1
      - echo Syncing dist/ to s3://$SITE_BUCKET ...
      # Everything except index.html and version.json has a content hash in its name, so it can be cached
      # forever; index.html must always be revalidated.
      # No --delete: tabs opened before this deploy still fetch the old build's files, so those stay until
      # prune-old-files.mjs (below) finds them unused for a week.
      - aws s3 sync dist/ "s3://$SITE_BUCKET" --exclude "*.html" --exclude "version.json" --cache-control "public,max-age=31536000,immutable"
      - aws s3 sync dist/ "s3://$SITE_BUCKET" --exclude "*" --include "*.html" --cache-control "public,max-age=0,must-revalidate"
      # Last, once every file it points to is up: running games read this to learn a new build is out
      # (src/core/update.ts), so it must never be cached.
      - aws s3 cp dist/version.json "s3://$SITE_BUCKET/version.json" --cache-control "no-cache" --content-type "application/json"
      # The site is live by now: a failure here only leaves old files in the bucket for the next deploy to clear.
      - node infrastructure/prune-old-files.mjs "$SITE_BUCKET" dist || echo "Pruning old files failed; they stay until the next deploy"
      - echo Invalidating CloudFront distribution $DISTRIBUTION_ID ...
      - aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"

cache:
  paths:
    - "node_modules/**/*"
